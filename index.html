<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreveen | Denise Guadagnuolo</title>
  <meta name="description" content="Portfolio of Denise Guadagnuolo, Computer Engineer and Software Developer.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0406'/><text x='50' y='70' font-size='64' text-anchor='middle' fill='%23d23a58' font-family='serif' font-style='italic'>D</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="intro" hidden>
    <canvas id="introRose" aria-hidden="true"></canvas>
    <button class="skip" id="skip" type="button">Skip</button>
    <div class="intro-text">
      <div class="signature">Dreveen</div>
      <div class="typed" id="typed" aria-hidden="true"></div>
    </div>
  </div>

  <header class="site-nav">
    <a class="logo" href="index.html">Dreveen</a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="menu">Menu</button>
    <nav class="links" id="menu">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="contacts.html">Contacts</a>
    </nav>
  </header>

  <main class="hero">
    <div>
      <p class="eyebrow reveal">Portfolio</p>
      <h1 class="reveal" style="--d:.1s">Denise <em>Guadagnuolo</em></h1>
      <p class="role reveal" style="--d:.25s">Computer Engineer &amp; Software Developer</p>
      <p class="tag reveal" style="--d:.4s">Building digital solutions through software, technology and innovation.</p>
      <div class="actions reveal" style="--d:.55s">
        <a class="btn solid" href="about.html">About me</a>
        <a class="btn" href="projects.html">Projects</a>
      </div>
    </div>
    <div class="rose-stage reveal" style="--d:.3s">
      <canvas id="heroRose" aria-label="A rotating three-dimensional rose" role="img"></canvas>
    </div>
  </main>

  <footer>
    <span>&copy; <span id="year">2026</span> Denise Guadagnuolo</span>
    <a href="https://github.com/dreveen" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="rose.js"></script>
  <script src="script.js"></script>
  <script>
    (function () {
      const intro = document.getElementById("intro");
      const heroCanvas = document.getElementById("heroRose");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let seen = false;
      try { seen = sessionStorage.getItem("dreveen-intro") === "1"; } catch (e) {}

      function showHero(bloomed) {
        mountRose(heroCanvas, { startBloomed: bloomed, minDist: 4.9, lookY: 0.05 });
      }

      if (seen || reduce) {
        intro.remove();
        showHero(true);
        return;
      }

      intro.hidden = false;
      document.body.style.overflow = "hidden";
      const introRose = mountRose(document.getElementById("introRose"), { lookY: -0.2 });
      const text = "Computer Engineer & Software Developer";
      const typed = document.getElementById("typed");
      let i = 0;
      const typer = setTimeout(function type() {
        typed.textContent = text.slice(0, ++i);
        if (i < text.length) setTimeout(type, 55);
      }, 3200);

      let done = false;
      function finish() {
        if (done) return;
        done = true;
        clearTimeout(typer);
        try { sessionStorage.setItem("dreveen-intro", "1"); } catch (e) {}
        intro.classList.add("leaving");
        document.body.style.overflow = "";
        showHero(true);
        setTimeout(function () {
          if (introRose) introRose.dispose();
          intro.remove();
        }, 1300);
      }

      document.getElementById("skip").addEventListener("click", finish);
      setTimeout(finish, 7500);
    })();
  </script>
</body>
</html>
